name: Flowday CI (Only Android APK)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: |
          npm install --legacy-peer-deps
          npm install react-native-mmkv@latest react-native-nitro-modules --legacy-peer-deps

      - name: 🧹 Limpiar entornos previos
        run: rm -rf android ios

      - name: 🤖 Generar carpetas nativas (Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 🛡️ Parche inteligente de Kotlin
        run: |
          cat << 'EOF' >> android/build.gradle
          subprojects {
              // Aplicar el parche SOLO si el nombre del módulo contiene 'expo'
              // Esto evita corromper 'react-native-nitro-modules'
              if (project.name.contains('expo')) {
                  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                      kotlinOptions {
                          freeCompilerArgs += ["-P", "plugin:androidx.compose.compiler.plugins.kotlin:suppressKotlinVersionCompatibilityCheck=1.9.25"]
                      }
                  }
              }
              
              configurations.all {
                  resolutionStrategy {
                      force 'androidx.core:core-splashscreen:1.0.1'
                  }
              }
          }
          EOF

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: 🏗️ Compilar APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 📤 Guardar APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: flowday-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk