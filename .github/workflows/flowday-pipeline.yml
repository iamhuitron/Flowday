name: Flowday CI (Only Android APK)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: |
          npm install --legacy-peer-deps
          npm install react-native-mmkv@latest react-native-nitro-modules --legacy-peer-deps

      - name: 🧹 Limpiar entornos previos
        run: rm -rf android ios

      - name: 🤖 Generar carpetas nativas (Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 🛡️ Inyectar Forzador de Versión de Kotlin
        run: |
          cat << 'EOF' >> android/build.gradle
          subprojects {
              configurations.all {
                  resolutionStrategy {
                      // Forzamos que cualquier librería que pida Kotlin 1.9.25 use la 1.9.24
                      eachDependency { details ->
                          if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.contains('kotlin')) {
                              details.useVersion '1.9.24'
                          }
                      }
                  }
              }
          }
          EOF

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: 🏗️ Compilar APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 📤 Guardar APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: flowday-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk