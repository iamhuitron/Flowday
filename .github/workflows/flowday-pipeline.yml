name: Flowday CI (Only Android APK)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: 🧹 Limpiar entornos previos
        run: rm -rf android ios

      - name: 🤖 Generar carpetas nativas (Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: ⚙️ Forzar bundle en gradle.properties
        run: |
          echo "" >> android/gradle.properties
          echo "reactNativeBundleInDebug=true" >> android/gradle.properties
          echo "hermesEnabled=true" >> android/gradle.properties

      - name: 🏗️ Compilar APK
        env:
          NODE_ENV: production
          EXPO_NO_DOTENV: 1
        run: |
          cd android
          ./gradlew assembleDebug \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" \
            -Dorg.gradle.parallel=true

      - name: 📤 Guardar APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: flowday-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
