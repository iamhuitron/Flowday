name: Flowday CI (Only Android APK)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: 📦 Instalar React Native CLI
        run: npm install --save-dev @react-native-community/cli --legacy-peer-deps

      - name: 🧹 Limpiar entornos previos
        run: rm -rf android ios

      - name: 🤖 Generar carpetas nativas (Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 📦 Generar JS Bundle
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file node_modules/expo-router/entry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: 🏗️ Compilar APK
        env:
          NODE_ENV: production
        run: |
          cd android
          ./gradlew assembleDebug \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" \
            -Dorg.gradle.parallel=true

      - name: 📤 Guardar APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: flowday-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
